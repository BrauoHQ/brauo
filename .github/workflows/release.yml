name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve version from tag
        id: v
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]; then
            printf '%s\n' 'Release tag must be v followed by a numeric extension version.' >&2
            exit 1
          fi
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check manifest version matches tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$manifest" != "$VERSION" ]; then
            echo "manifest version $manifest does not match tag $VERSION" >&2
            exit 1
          fi

      - name: Build package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          zip -r -X "brauo-${VERSION}.zip" \
            manifest.json background.js content.js content.css \
            options.html options.js popup.html popup.js shared.js voices.js icons _locales

      - name: Generate checksum
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: sha256sum "brauo-${VERSION}.zip" | tee "brauo-${VERSION}.zip.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: "brauo-${{ steps.v.outputs.version }}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          sha="$(cut -d ' ' -f1 "brauo-${VERSION}.zip.sha256")"
          cat > notes.md <<NOTES
          SHA-256 of brauo-${VERSION}.zip: ${sha}

          Install and verification: https://github.com/${REPO}#verify-your-download

          This zip was built by GitHub Actions from this tag and carries a build-provenance attestation. Verify:
          gh attestation verify brauo-${VERSION}.zip --repo ${REPO}
          NOTES
          gh release create "v${VERSION}" \
            "brauo-${VERSION}.zip" \
            "brauo-${VERSION}.zip.sha256" \
            --title "Brauo v${VERSION}" \
            --notes-file notes.md
